name: CI

on: [push, pull_request, workflow_dispatch]

env:
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux system dependencies (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend check (svelte-check)
        run: npm run check

      # TODO: remove `continue-on-error` once the codebase is formatted with cargo fmt.
      - name: Rust formatting check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
        continue-on-error: true

      # TODO: remove `continue-on-error` once existing clippy warnings
      # (e.g. too_many_arguments) are fixed, see AGENTS.md conventions.
      - name: Rust lint (clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
        continue-on-error: true

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
